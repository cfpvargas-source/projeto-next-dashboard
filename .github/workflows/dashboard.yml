name: Gerar Dashboard Projeto Next

on:
  schedule:
    # Todo dia às 15:00 UTC = 12:00 horário de Brasília (BRT = UTC-3)
    - cron: '0 15 * * *'
  workflow_dispatch:  # permite rodar manualmente pelo GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write   # necessário para fazer commit do HTML gerado

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: pip install requests

      - name: Rodar script de geração
        env:
          CLICKUP_TOKEN: ${{ secrets.CLICKUP_TOKEN }}
        run: python gerar_dashboard.py

      - name: Commit e push do dashboard atualizado
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ProjetoNext_Dashboard_LATEST.html historico_snapshots.json
          git add ProjetoNext_Dashboard_*.html || true
          git diff --staged --quiet || git commit -m "Dashboard atualizado - $(date +'%d/%m/%Y %H:%M')"
          git push
